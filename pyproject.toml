[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cqc-email-processor"
version = "0.1.0"
description = "CQC Intelligent Email Processor Azure Functions service"
requires-python = ">=3.11"
dependencies = [
  "azure-functions>=1.20.0",
  "azure-identity>=1.17.1",
  "azure-storage-blob>=12.22.0",
  "azure-servicebus>=7.12.2",
  "azure-ai-formrecognizer>=3.3.3",
  "requests>=2.32.3",
  "pydantic>=2.8.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
